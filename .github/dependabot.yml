version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Moves together with the wails3 CLI the workflows install and @wailsio/runtime.
      - dependency-name: github.com/wailsapp/wails/v3

  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@wailsio/runtime"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
