name: CI

on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun install --frozen-lockfile
        working-directory: contract

      - name: Type-check contract and scripts
        run: bun check
        working-directory: contract

      - name: Build frontend
        run: bun run build
        working-directory: frontend

      - name: Go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...
          go build -tags production,stable ./...

      - name: Generated files are current
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          (cd contract && bun gen.ts)
          wails3 generate bindings -f '-tags production' -clean=true -ts -i
          git add -A --intent-to-add
          git diff --exit-code -- internal frontend/src/lib/limits.gen.ts frontend/bindings
